name: Recordatorios Push (Manual)

# Deshabilitamos schedule aquí porque GitHub Actions gratuito acumula retrasos de 3 a 5 horas.
# Las notificaciones exactas al segundo se gestionan con cron-job.org o Vercel Cron.
on:
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar API de Recordatorios
        run: |
          curl -X GET "https://dinow-ashy.vercel.app/api/cron/recordatorio" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
