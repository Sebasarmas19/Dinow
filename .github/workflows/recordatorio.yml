name: Recordatorios Push (Cron)

on:
  schedule:
    # Franjas horarias optimizadas para la Familia Armas (UTC-4 Caracas):
    - cron: '30 10 * * *'  # 6:30 AM Caracas - Mañana (Misión asignada)
    - cron: '30 17 * * *'  # 1:30 PM Caracas - Almuerzo (Cocina/Fregado)
    - cron: '0 22 * * *'   # 6:00 PM Caracas - Tarde (Paseo de Sofi / Pendientes)
    - cron: '30 0 * * *'   # 8:30 PM Caracas - Anticipación (Plan de mañana)
    - cron: '30 1 * * *'   # 9:30 PM Caracas - Alerta de cierre (Penalización colectiva)
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar API de Recordatorios
        run: |
          curl -X GET "https://dinow-ashy.vercel.app/api/cron/recordatorio" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
