name: Generar Día (Manual)

# Deshabilitamos schedule automático aquí porque cron-job.org se encarga de dispararlo a las 3:00 AM exactas.
# Mantenemos workflow_dispatch para que puedas dispararlo manualmente desde GitHub si alguna vez lo necesitas.
on:
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Generar Día API
        run: |
          curl -X GET "https://dinow-ashy.vercel.app/api/cron/generar-dia" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
